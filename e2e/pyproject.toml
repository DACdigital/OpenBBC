[project]
name = "openbbc-e2e"
version = "0.1.0"
description = "Full-stack e2e suite for OpenBBC (docker compose)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
