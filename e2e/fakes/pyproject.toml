[project]
name = "e2e-fakes"
version = "0.1.0"
description = "Test-only fakes (MCP server, LLM) for the OpenBBC e2e harness"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
