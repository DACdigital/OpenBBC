{{/*
LLM provider keys for the aikdm cron pods.

Rendered when aikdmRunner.secrets.existingSecret is empty; otherwise the
user-provided Secret is consumed directly via envFrom on the CronJobs.
*/}}
{{- if not .Values.aikdmRunner.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbbc.fullname" . }}-aikdm
  labels:
    {{- include "openbbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: aikdm-runner
type: Opaque
stringData:
  {{- with .Values.aikdmRunner.secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.aikdmRunner.secrets.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.aikdmRunner.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
