{{- if .Values.aikdmRunner.cronjobs.alphas.enabled -}}
{{- $cj := .Values.aikdmRunner.cronjobs.alphas -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openbbc.aikdmRunner.fullname" . }}-alphas
  labels:
    {{- include "openbbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: aikdm-runner
    openbbc.io/drainer: alphas
spec:
  schedule: {{ $cj.schedule | quote }}
  concurrencyPolicy: {{ $cj.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $cj.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $cj.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $cj.activeDeadlineSeconds }}
      backoffLimit: {{ $cj.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "openbbc.selectorLabels" (dict "root" . "component" "aikdm-runner") | nindent 12 }}
            openbbc.io/drainer: alphas
          {{- with .Values.aikdmRunner.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.aikdmRunner.securityContext | nindent 12 }}
          containers:
            - name: drainer
              image: "{{ include "openbbc.aikdmRunner.image" . }}"
              imagePullPolicy: {{ .Values.aikdmRunner.image.pullPolicy }}
              workingDir: /repo
              command: ["/repo/scripts/process_pending_alphas.sh"]
              env:
                - name: OPENBBCD_URL
                  value: {{ include "openbbc.openbbcdUrl" . | quote }}
                # generate_alpha.sh drives seed_bundle.py, which writes
                # directly to Postgres — the alpha drainer needs DB access
                # on top of the LLM keys the other drainers use.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "openbbc.databaseSecretName" . }}
                      key:  {{ include "openbbc.databaseSecretKey" . }}
              envFrom:
                - secretRef:
                    name: {{ include "openbbc.aikdmSecretName" . }}
              resources:
                {{- toYaml .Values.aikdmRunner.resources | nindent 16 }}
          {{- with .Values.aikdmRunner.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.aikdmRunner.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.aikdmRunner.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
