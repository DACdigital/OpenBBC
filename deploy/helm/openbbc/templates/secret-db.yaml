{{/*
DATABASE_URL Secret consumed by open-bbcd.

Rendered when:
  - postgres.enabled=true                                    → URL built from in-cluster creds
  - externalDatabase.url is set (and no existingSecret)      → wrap the URL

Skipped when externalDatabase.existingSecret is set — open-bbcd will consume
that Secret directly (see openbbcd-deployment.yaml).
*/}}
{{- if or .Values.postgres.enabled .Values.externalDatabase.url -}}
{{- if not (and (not .Values.postgres.enabled) .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openbbc.fullname" . }}-db
  labels:
    {{- include "openbbc.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ include "openbbc.databaseUrl" . | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
{{- end }}
